<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base64 テキスト/画像 ラウンドトリップ</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
<div class="max-w-4xl mx-auto p-4">
  <h1 class="text-2xl font-bold text-gray-800 mb-6">Base64 テキスト/画像 ラウンドトリップ</h1>

  <!-- タブ -->
  <div class="flex gap-2 mb-6 border-b border-gray-200">
    <button id="tab-text" onclick="switchTab('text')"
      class="px-4 py-2 text-sm font-medium border-b-2 border-blue-500 text-blue-600 -mb-px"
      aria-label="テキスト変換タブ">テキスト変換</button>
    <button id="tab-image" onclick="switchTab('image')"
      class="px-4 py-2 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 -mb-px"
      aria-label="画像変換タブ">画像変換</button>
    <button id="tab-decode" onclick="switchTab('decode')"
      class="px-4 py-2 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 -mb-px"
      aria-label="Base64デコードタブ">Base64デコード</button>
  </div>

  <!-- テキスト変換タブ -->
  <div id="panel-text" class="space-y-4">
    <div>
      <label for="text-input" class="block text-sm font-medium text-gray-700 mb-1">入力テキスト</label>
      <textarea id="text-input" rows="5"
        class="w-full border border-gray-300 rounded-md p-3 font-mono text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
        placeholder="エンコードするテキストを入力してください"></textarea>
    </div>
    <div class="flex gap-3">
      <button onclick="encodeText()" aria-label="Base64エンコード"
        class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 text-sm font-medium">
        → Base64 エンコード
      </button>
      <button onclick="decodeText()" aria-label="Base64デコード"
        class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 text-sm font-medium">
        ← Base64 デコード
      </button>
      <button onclick="clearText()" aria-label="クリア"
        class="px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 text-sm font-medium">
        クリア
      </button>
    </div>
    <div id="text-error" class="hidden text-red-600 text-sm"></div>
    <div>
      <div class="flex justify-between items-center mb-1">
        <label class="block text-sm font-medium text-gray-700">出力</label>
        <button onclick="copyOutput('text-output')" aria-label="出力をコピー"
          class="px-3 py-1 text-xs bg-gray-100 hover:bg-gray-200 rounded border border-gray-300 text-gray-600">
          コピー
        </button>
      </div>
      <textarea id="text-output" rows="5" readonly
        class="w-full border border-gray-300 rounded-md p-3 font-mono text-sm bg-gray-50"
        placeholder="出力がここに表示されます"></textarea>
    </div>
  </div>

  <!-- 画像変換タブ -->
  <div id="panel-image" class="hidden space-y-4">
    <div id="drop-zone"
      class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition-colors"
      ondragover="handleDragOver(event)" ondrop="handleDrop(event)" onclick="document.getElementById('file-input').click()"
      aria-label="画像ファイルのドロップゾーン">
      <svg class="mx-auto h-12 w-12 text-gray-400 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
      </svg>
      <p class="text-gray-600">画像ファイルをドラッグ&ドロップ</p>
      <p class="text-gray-400 text-sm mt-1">または クリックしてファイルを選択</p>
      <input type="file" id="file-input" accept="image/*" class="hidden" onchange="handleFileSelect(event)"
        aria-label="画像ファイルを選択">
    </div>

    <div id="image-preview-section" class="hidden">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <p class="text-sm font-medium text-gray-700 mb-2">プレビュー</p>
          <img id="image-preview" src="" alt="プレビュー" class="max-w-full max-h-48 border border-gray-200 rounded-md">
          <p id="image-info" class="text-xs text-gray-500 mt-1"></p>
        </div>
        <div class="space-y-3">
          <div>
            <div class="flex justify-between items-center mb-1">
              <p class="text-sm font-medium text-gray-700">Base64 Data URI</p>
              <button onclick="copyOutput('image-base64')" aria-label="Base64 URIをコピー"
                class="px-3 py-1 text-xs bg-gray-100 hover:bg-gray-200 rounded border border-gray-300 text-gray-600">
                コピー
              </button>
            </div>
            <textarea id="image-base64" rows="4" readonly
              class="w-full border border-gray-300 rounded-md p-2 font-mono text-xs bg-gray-50 break-all"></textarea>
          </div>
          <div>
            <div class="flex justify-between items-center mb-1">
              <p class="text-sm font-medium text-gray-700">HTML 埋め込みコード</p>
              <button onclick="copyOutput('image-html')" aria-label="HTMLコードをコピー"
                class="px-3 py-1 text-xs bg-gray-100 hover:bg-gray-200 rounded border border-gray-300 text-gray-600">
                コピー
              </button>
            </div>
            <textarea id="image-html" rows="4" readonly
              class="w-full border border-gray-300 rounded-md p-2 font-mono text-xs bg-gray-50"></textarea>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Base64デコードタブ -->
  <div id="panel-decode" class="hidden space-y-4">
    <div>
      <label for="decode-input" class="block text-sm font-medium text-gray-700 mb-1">Base64 Data URI または Base64文字列を入力</label>
      <textarea id="decode-input" rows="5"
        class="w-full border border-gray-300 rounded-md p-3 font-mono text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
        placeholder="data:image/png;base64,iVBORw0KGgo... または 純粋なBase64文字列"></textarea>
    </div>
    <button onclick="decodeBase64Image()" aria-label="デコードしてプレビュー"
      class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 text-sm font-medium">
      デコード・プレビュー
    </button>
    <div id="decode-error" class="hidden text-red-600 text-sm"></div>
    <div id="decoded-preview" class="hidden">
      <p class="text-sm font-medium text-gray-700 mb-2">デコード結果</p>
      <img id="decoded-image" src="" alt="デコードされた画像" class="max-w-full max-h-64 border border-gray-200 rounded-md">
    </div>
    <div id="decoded-text-result" class="hidden">
      <p class="text-sm font-medium text-gray-700 mb-2">デコードされたテキスト</p>
      <pre id="decoded-text" class="w-full border border-gray-200 rounded-md p-3 bg-gray-50 text-sm font-mono whitespace-pre-wrap break-all"></pre>
    </div>
  </div>

  <!-- コピー成功トースト -->
  <div id="copy-toast" class="hidden fixed bottom-6 right-6 bg-gray-800 text-white px-4 py-2 rounded-md text-sm shadow-lg">
    コピーしました！
  </div>
</div>

<script>
function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function switchTab(name) {
  ['text','image','decode'].forEach(t => {
    document.getElementById('panel-'+t).classList.toggle('hidden', t !== name);
    const btn = document.getElementById('tab-'+t);
    if (t === name) {
      btn.classList.replace('border-transparent','border-blue-500');
      btn.classList.replace('text-gray-500','text-blue-600');
    } else {
      btn.classList.replace('border-blue-500','border-transparent');
      btn.classList.replace('text-blue-600','text-gray-500');
    }
  });
}

function encodeText() {
  const input = document.getElementById('text-input').value;
  const errEl = document.getElementById('text-error');
  errEl.classList.add('hidden');
  try {
    const encoded = btoa(unescape(encodeURIComponent(input)));
    document.getElementById('text-output').value = encoded;
  } catch(e) {
    errEl.textContent = 'エンコードエラー: ' + escapeHtml(e.message);
    errEl.classList.remove('hidden');
  }
}

function decodeText() {
  const input = document.getElementById('text-input').value;
  const errEl = document.getElementById('text-error');
  errEl.classList.add('hidden');
  try {
    const decoded = decodeURIComponent(escape(atob(input.trim())));
    document.getElementById('text-output').value = decoded;
  } catch(e) {
    errEl.textContent = 'デコードエラー: 有効なBase64文字列を入力してください';
    errEl.classList.remove('hidden');
  }
}

function clearText() {
  document.getElementById('text-input').value = '';
  document.getElementById('text-output').value = '';
  document.getElementById('text-error').classList.add('hidden');
}

function handleDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
}

function handleDrop(e) {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) {
    processImageFile(file);
  }
}

function handleFileSelect(e) {
  const file = e.target.files[0];
  if (file) processImageFile(file);
}

function processImageFile(file) {
  const reader = new FileReader();
  reader.onload = function(e) {
    const dataUri = e.target.result;
    const preview = document.getElementById('image-preview');
    preview.src = dataUri;

    const sizeKb = (file.size / 1024).toFixed(1);
    document.getElementById('image-info').textContent =
      escapeHtml(file.name) + ' (' + escapeHtml(file.type) + ', ' + sizeKb + ' KB) → Base64: ' + (dataUri.length / 1024).toFixed(1) + ' KB';

    document.getElementById('image-base64').value = dataUri;
    document.getElementById('image-html').value = '<img src="' + dataUri.substring(0, 50) + '..." alt="画像">\n\n<!-- 完全なData URI -->\n<img src="' + dataUri + '" alt="画像">';

    document.getElementById('image-preview-section').classList.remove('hidden');
  };
  reader.readAsDataURL(file);
}

function decodeBase64Image() {
  const input = document.getElementById('decode-input').value.trim();
  const errEl = document.getElementById('decode-error');
  errEl.classList.add('hidden');
  document.getElementById('decoded-preview').classList.add('hidden');
  document.getElementById('decoded-text-result').classList.add('hidden');

  if (!input) {
    errEl.textContent = '入力が空です';
    errEl.classList.remove('hidden');
    return;
  }

  if (input.startsWith('data:image/')) {
    const img = document.getElementById('decoded-image');
    img.src = input;
    img.onerror = function() {
      errEl.textContent = '有効な画像データではありません';
      errEl.classList.remove('hidden');
      document.getElementById('decoded-preview').classList.add('hidden');
    };
    document.getElementById('decoded-preview').classList.remove('hidden');
    return;
  }

  try {
    const b64 = input.includes(',') ? input.split(',')[1] : input;
    const decoded = decodeURIComponent(escape(atob(b64)));
    const textEl = document.getElementById('decoded-text');
    textEl.textContent = decoded;
    document.getElementById('decoded-text-result').classList.remove('hidden');
  } catch(e) {
    // 画像として試みる
    try {
      const dataUri = 'data:image/png;base64,' + (input.includes(',') ? input.split(',')[1] : input);
      const img = document.getElementById('decoded-image');
      img.src = dataUri;
      document.getElementById('decoded-preview').classList.remove('hidden');
    } catch(e2) {
      errEl.textContent = '有効なBase64データではありません';
      errEl.classList.remove('hidden');
    }
  }
}

function copyOutput(id) {
  const el = document.getElementById(id);
  navigator.clipboard.writeText(el.value).then(() => {
    const toast = document.getElementById('copy-toast');
    toast.classList.remove('hidden');
    setTimeout(() => toast.classList.add('hidden'), 2000);
  }).catch(() => {
    el.select();
    document.execCommand('copy');
  });
}
</script>
</body>
</html>
